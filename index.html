<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jabeen Mehendi | Darbhanga</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    body {
      font-family: Georgia, serif;
      background: #fbf7ed;
      color: #243d2d;
    }
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #243d2d;
      color: #fff;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    nav .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }
    nav a {
      color: #fbf7ed;
      text-decoration: none;
      font-size: 14px;
    }
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 20px 40px;
      background: #f4ecdc;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
      color: #243d2d;
    }
    .hero p {
      font-size: 18px;
      max-width: 600px;
      line-height: 1.6;
    }
    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .gallery-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .gallery-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .gallery-card .info {
      padding: 10px 14px;
      font-size: 13px;
      color: #666;
    }
    footer {
      background: #243d2d;
      color: #fff;
      text-align: center;
      padding: 25px 20px;
      font-size: 14px;
      margin-top: 50px;
    }
    .whatsapp {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #25d366;
      color: white;
      padding: 14px 18px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Jabeen Mehendi</div>
    <ul>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="hero">
    <h1>Jabeen Mehendi Artist</h1>
    <p>Darbhanga, Bihar • Bridal, Arabic & Festive Designs</p>
  </div>

  <section id="gallery">
    <h2 class="section-title">Our Designs</h2>
    <div class="gallery-grid" id="galleryGrid">
      <p style="grid-column: 1 / -1; text-align: center;">Loading designs...</p>
    </div>
  </section>

  <a class="whatsapp" href="https://wa.me/919288594755" target="_blank">Chat on WhatsApp</a>

  <footer>
    &copy; 2026 Jabeen Mehendi • Darbhanga, Bihar<br><br>
    Made with &hearts; for beautiful mehendi moments
  </footer>

  <script>
    const galleryGrid = document.getElementById("galleryGrid");

    fetch("https://api.github.com/repos/jabeenmehendi03/jabeen-mehendi/contents/?per_page=100")
      .then(response => {
        if (!response.ok) {
          throw new Error("API rate limit or network error");
        }
        return response.json();
      })
      .then(files => {
        galleryGrid.innerHTML = "";

        const images = files.filter(file => 
          file.type === "file" && 
          /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        if (images.length === 0) {
          galleryGrid.innerHTML = "<p style='grid-column:1/-1;text-align:center;'>No images found in repository root.</p>";
          return;
        }

        images.forEach(img => {
          const card = document.createElement("div");
          card.className = "gallery-card";
          card.innerHTML = `
            <img src="${img.download_url}" alt="Mehendi Design" loading="lazy">
            <div class="info">${img.name}</div>
          `;
          galleryGrid.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        galleryGrid.innerHTML = "<p style='grid-column:1/-1;text-align:center;'>Unable to load gallery right now.</p>";
      });
  </script>
</body>
</html>
